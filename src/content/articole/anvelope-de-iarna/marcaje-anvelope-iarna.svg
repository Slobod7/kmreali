<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Marcajele M+S, 3PMSF și DOT de pe flancul unei anvelope de iarnă">
  <!-- Three sidewall markings on dark tiles, in the site's colours. Drawn for this article. -->
  <style>
    .mare { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .mic { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 600; fill: #e4dfd4; }
    .eticheta { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; fill: #15171a; letter-spacing: 1px; }
  </style>

  <!-- M+S -->
  <g>
    <rect width="360" height="420" rx="30" fill="#15171a"/>
    <text x="180" y="210" text-anchor="middle" font-size="140" class="mare">M+S</text>
    <rect x="30" y="282" width="300" height="44" fill="#ffd60a"/>
    <text x="180" y="315" text-anchor="middle" font-size="24" class="eticheta">AJUNGE ÎN ROMÂNIA</text>
    <text x="180" y="372" text-anchor="middle" font-size="28" class="mic">noroi și zăpadă, fără test</text>
  </g>

  <!-- 3PMSF: three-peak mountain with a snowflake -->
  <g transform="translate(420 0)">
    <rect width="360" height="420" rx="30" fill="#15171a"/>
    <g transform="translate(80 30)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 210 L62 104 L92 146 L132 60 L176 150 L192 130 L190 210 Z"/>
      <g transform="translate(104 172)">
        <path d="M0 -30 L0 30 M-26 -15 L26 15 M-26 15 L26 -15"/>
        <path d="M-8 -22 L0 -14 L8 -22 M-8 22 L0 14 L8 22" stroke-width="6"/>
        <path d="M-23 -4 L-13 -8 L-15 -19 M23 4 L13 8 L15 19" stroke-width="6"/>
        <path d="M-23 4 L-13 8 L-15 19 M23 -4 L13 -8 L15 -19" stroke-width="6"/>
      </g>
    </g>
    <rect x="30" y="282" width="300" height="44" fill="#ffd60a"/>
    <text x="180" y="315" text-anchor="middle" font-size="24" class="eticheta">TESTATĂ PE ZĂPADĂ</text>
    <text x="180" y="372" text-anchor="middle" font-size="28" class="mic">3PMSF, cerută în Germania</text>
  </g>

  <!-- DOT date code -->
  <g transform="translate(840 0)">
    <rect width="360" height="420" rx="30" fill="#15171a"/>
    <text x="180" y="120" text-anchor="middle" font-size="44" class="mic" letter-spacing="6">DOT … </text>
    <rect x="70" y="146" width="220" height="96" rx="48" fill="none" stroke="#ffffff" stroke-width="7"/>
    <text x="180" y="221" text-anchor="middle" font-size="84" class="mare">4524</text>
    <rect x="30" y="282" width="300" height="44" fill="#ffd60a"/>
    <text x="180" y="315" text-anchor="middle" font-size="24" class="eticheta">DATA FABRICAȚIEI</text>
    <text x="180" y="372" text-anchor="middle" font-size="28" class="mic">săptămâna 45 din 2024</text>
  </g>
</svg>
